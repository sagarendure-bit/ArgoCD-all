apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: sync-waves-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"     # ← runs THIRD
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: app
        image: nginx:alpine
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: demo-config          # ← consumes the wave -1 ConfigMap
        - secretRef:
            name: demo-secret          # ← consumes the wave 0 Secret
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
