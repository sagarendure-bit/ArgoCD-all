apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: notes-app-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/sagarendure-bit/ArgoCD-all.git
      revision: main
      directories:
      - path: applicationsets/notes-app
  template:
    metadata:
      name: notes-app
    spec:
      project: default
      source:
        repoURL: https://github.com/sagarendure-bit/ArgoCD-all.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
