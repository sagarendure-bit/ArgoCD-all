apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-shop
spec:
  replicas: 5
  selector:
    matchLabels:
      app: online-shop
  template:
    metadata:
      labels:
        app: online-shop
    spec:
      containers:
      - name: online-shop
        image: node:20-alpine
        command:
          - sh
          - -c
          - |
            node -e "require('http').createServer((req,res)=>{res.writeHead(200);res.end('online-shop OK from ARM64\n')}).listen(3000)"
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
