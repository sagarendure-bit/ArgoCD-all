apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-app-notif
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-health-degraded.gmail: "sagarendure@gmail.com"
    notifications.argoproj.io/subscribe.on-sync-succeeded.gmail: "sagarendure@gmail.com"
    notifications.argoproj.io/subscribe.on-sync-failed.gmail: "sagarendure@gmail.com"
spec:
  project: default
  source:
    repoURL: https://github.com/sagarendure-bit/ArgoCD-all.git
    targetRevision: main
    path: sagarendure/notes-app        # ← ArgoCD reads this folder
  destination:
    server: https://kubernetes.default.svc
    namespace: notif-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
